stages:
  - build
  - test
  - secret_detection
  - quality
  - dependency_scan
  - docker_build
  - image_scan
  - dast
  - sign_image
  - push
  - deploy

default:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  tags:
    - archlinux

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  IMAGE_CANDIDATE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

.on_main: &on_main
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  image: node:22-alpine
  script:
    - npm ci
    - npm run build --if-present

test_unit:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm run test:unit

test_integration:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm run test:integration

secret_detection:
  stage: secret_detection
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --redact -v

eslint:
  stage: quality
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci
    - npm run lint

semgrep:
  stage: quality
  image: semgrep/semgrep
  script:
    - semgrep scan --config auto --metrics=off --error .

dependency_scan:
  stage: dependency_scan
  image: node:22-alpine
  script:
    - npm audit --audit-level=high --omit=dev

docker_build:
  stage: docker_build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE_CANDIDATE" .
    - docker push "$IMAGE_CANDIDATE"
    - echo "IMAGE_DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_CANDIDATE")" > build.env
  artifacts:
    reports:
      dotenv: build.env

image_scan:
  stage: image_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths: 
      - .trivycache/
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_DIGEST_REF"

dast:
  stage: dast
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  services:
    - name: "$IMAGE_CANDIDATE"
      alias: app
  variables:
    ZAP_TARGET: "http://app:3000"
  script:
    - mkdir -p /zap/wrk
    - curl -fs --retry 20 --retry-connrefused --retry-delay 2 "${ZAP_TARGET}/health"
    - zap-baseline.py -t "$ZAP_TARGET" -r zap-report.html -J zap-report.json -m 3 -I
  after_script:
    - cp /zap/wrk/zap-report.* "$CI_PROJECT_DIR/" || true
  artifacts:
    when: always
    expire_in: 1 week
    paths: 
      - zap-report.html
      - zap-report.json

sign_image:
  stage: sign_image
  image: alpine:3.20
  <<: *on_main
  before_script:
    - apk add --no-cache cosign
  script:
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - cosign sign --yes --key "$COSIGN_PRIVATE_KEY" "$IMAGE_DIGEST_REF"

push:
  stage: push
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  <<: *on_main
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$IMAGE_DIGEST_REF"
    - docker tag "$IMAGE_DIGEST_REF" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy:
  stage: deploy
  image: python:3.12-alpine
  when: manual
  <<: *on_main
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client cosign
    - pip install --no-cache-dir ansible-core
    - ansible-galaxy collection install community.docker
    - chmod 600 "$SSH_PRIVATE_KEY"
  script:
    - cosign verify --key "$COSIGN_PUBLIC_KEY" "$IMAGE_DIGEST_REF"
    - >
      ansible-playbook -i "$DEPLOY_HOST," -u "$DEPLOY_USER"
      --private-key "$SSH_PRIVATE_KEY"
      -e "image=$IMAGE_DIGEST_REF registry=$CI_REGISTRY registry_user=gitlab-ci-token registry_password=$CI_JOB_TOKEN"
      ansible/deploy.yml
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"