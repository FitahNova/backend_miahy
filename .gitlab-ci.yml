stages:
  - build
  - test
  - secret_detection
  - quality
  - dependency_scan
  - docker_build
  - image_scan
  - dast
  - sign_image
  - push
  - deploy

default:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    when: always
  tags:
    - archlinux

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_prefer_offline: "true"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "300000"
  npm_config_maxsockets: "3"
  IMAGE_CANDIDATE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

.on_main: &on_main
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  script:
    - npm ci || npm ci || npm ci
    - npm run build --if-present

test_unit:
  stage: test
  variables:
    NODE_ENV: "test"
    DATABASE_URL: "postgresql://postgres:ci@localhost:5432/ci"
    JWT_SECRET: "000000000000000000000000000000000000000000000000"
    GMAIL_USER: "ci@example.com"
    GMAIL_APP_PASSWORD: "factice"
  script:
    - npm ci || npm ci || npm ci
    - node_modules/.bin/prisma generate --config prisma7.config.ts
    - npm run test:unit

test_integration:
  stage: test
  services:
    - name: postgres:17-alpine
      alias: db
      variables:
        POSTGRES_PASSWORD: "ci"
        POSTGRES_DB: "ci"
  variables:
    DATABASE_URL_TEST: "postgresql://postgres:ci@db:5432/ci"
  script:
    - npm ci || npm ci || npm ci
    - node_modules/.bin/prisma generate --config prisma7.config.ts
    - npm run test:integration

secret_detection:
  stage: secret_detection
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --redact -v

eslint:
  stage: quality
  script:
    - npm ci || npm ci || npm ci
    - npm run lint

typecheck:
  stage: quality
  script:
    - npm ci || npm ci || npm ci
    - npm run typecheck

semgrep:
  stage: quality
  image: semgrep/semgrep
  script:
    - semgrep scan --config auto --error .

dependency_scan:
  stage: dependency_scan
  script:
    - npm audit --audit-level=high --omit=dev

docker_build:
  stage: docker_build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE_CANDIDATE" .
    - docker push "$IMAGE_CANDIDATE"
    - echo "IMAGE_DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_CANDIDATE")" > build.env
  artifacts:
    reports:
      dotenv: build.env

image_scan:
  stage: image_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy image --timeout 20m --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_DIGEST_REF"


dast:
  stage: dast
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  services:
    - name: postgres:17-alpine
      alias: db
      variables:
        POSTGRES_PASSWORD: "ci"
        POSTGRES_DB: "ci"
    - name: "$IMAGE_CANDIDATE"
      alias: app
      variables:
        NODE_ENV: "production"
        PORT: "4000"
        DATABASE_URL: "postgresql://postgres:ci@db:5432/ci"
        BD_CONNEXION: "tcp"
        JWT_SECRET: "000000000000000000000000000000000000000000000000"
        CLIENT_ORIGIN: "http://app:4000"
        GMAIL_USER: "ci@example.com"
        GMAIL_APP_PASSWORD: "factice"
  variables:
    DAST_PORT: "4000"
    DAST_HEALTH_PATH: "/api/health"
    ZAP_TARGET: "http://app:4000"
  script:
    - mkdir -p /zap/wrk
    - curl -fs --retry 20 --retry-connrefused --retry-delay 2 "${ZAP_TARGET}${DAST_HEALTH_PATH}"
    - zap-baseline.py -t "$ZAP_TARGET" -r zap-report.html -J zap-report.json -m 3 -I
  after_script:
    - cp /zap/wrk/zap-report.* "$CI_PROJECT_DIR/" || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - zap-report.html
      - zap-report.json

sign_image:
  stage: sign_image
  image: alpine:3.20
  <<: *on_main
  before_script:
    - apk add --no-cache cosign
  script:
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - cosign sign --yes --key "$COSIGN_PRIVATE_KEY" "$IMAGE_DIGEST_REF"

push:
  stage: push
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  <<: *on_main
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$IMAGE_DIGEST_REF"
    - docker tag "$IMAGE_DIGEST_REF" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy:
  stage: deploy
  image: python:3.12-alpine
  needs: [docker_build, sign_image, push]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production
  variables:
    SERVICE: back
    INFRA_PROJECT: miahy1/miahy-infra
    ANSIBLE_HOST_KEY_CHECKING: "False"
  before_script:
    - apk add --no-cache git openssh-client cosign
    - pip install --no-cache-dir ansible-core
    - chmod 600 "$SSH_PRIVATE_KEY"
  script:
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - cosign verify --key "$COSIGN_PUBLIC_KEY" "$IMAGE_DIGEST_REF"
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/${INFRA_PROJECT}.git" miahy-infra
    - cd miahy-infra/ansible
    - ansible-playbook -i inventory.ini deploy.yml -e service="$SERVICE" -e image="$IMAGE_DIGEST_REF"